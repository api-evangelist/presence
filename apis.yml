name: Presence
description: >-
  Presence is a student engagement and co-curricular involvement platform for
  higher education, now part of Modern Campus. It helps colleges and
  universities manage student organizations, campus events, involvement and
  attendance tracking, co-curricular records, forms, and engagement analytics
  so institutions can attract, engage, and retain learners. Modern Campus
  serves more than 1,700 colleges, universities, and education providers.
  Presence is delivered as a closed SaaS product with support and reference
  code available through the Modern Campus customer support portal; there is
  no public developer portal, OpenAPI, or self-service API surface published at
  this time, so this profile captures company identity and probed domain
  security rather than API artifacts.
